services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s3-admin
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: kiatthikun-k@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: kiatthikun
    depends_on:
      - db

volumes:
  postgres_data:
